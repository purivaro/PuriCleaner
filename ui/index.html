<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puri Cleaner</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <header class="topbar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="icon.svg" alt="" class="brand-icon">
      <div data-tauri-drag-region>
        <div class="brand-name">Puri Cleaner</div>
        <div class="brand-sub" id="brandSub" data-i18n="tagline"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="seg tab-seg" id="tabSeg" role="tablist">
        <button data-tab="disk" role="tab">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h14" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="14" r=".9" fill="currentColor"/></svg>
          <span data-i18n="tab_disk"></span>
        </button>
        <button data-tab="apps" role="tab">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span data-i18n="tab_apps"></span>
        </button>
        <button data-tab="mem" role="tab">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="14" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 6V4m4 2V4m4 2V4M6 16v-2m4 2v-2m4 2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-i18n="tab_mem"></span>
        </button>
      </div>
      <button class="icon-btn theme-btn" id="themeBtn">
        <svg class="sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 12.4A6.6 6.6 0 0 1 7.6 3.8a6.6 6.6 0 1 0 8.6 8.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <div class="seg seg-sm" id="langSeg" role="group" aria-label="Language">
        <button data-lang="th">ไทย</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="btn btn-ghost" id="rescanBtn" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.4h-3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="rescan"></span>
      </button>
    </div>
  </header>

  <!-- First scan -->
  <section class="scan-screen" id="scanScreen">
    <div class="scan-card">
      <div class="scan-orbit" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" class="orbit-track"/>
          <circle cx="60" cy="60" r="52" class="orbit-arc"/>
        </svg>
        <div class="scan-orbit-num" id="scanBytes">0 GB</div>
      </div>
      <h1 class="scan-title" data-i18n="scanning_title"></h1>
      <p class="scan-meta"><span id="scanFiles">0</span> <span data-i18n="files_unit"></span> · <span id="scanTime">0s</span></p>
      <p class="scan-path" id="scanPath">&nbsp;</p>
      <p class="scan-stalled" id="scanStalled" data-i18n="scan_stalled" hidden></p>
      <p class="scan-note" data-i18n="scan_note"></p>
      <button class="btn btn-ghost btn-sm" id="cancelScanBtn" data-i18n="cancel"></button>
      <div class="scan-error" id="scanError" hidden></div>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <div class="banner" id="fdaBanner" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 2 17h16L10 2.5Zm0 5v4.5m0 2.5v.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="fdaText"></span>
      <button class="btn btn-sm" id="fdaBtn" data-i18n="fda_button"></button>
      <button class="icon-btn" id="fdaClose" aria-label="close">×</button>
    </div>

    <section class="stats">
      <div class="stat">
        <div class="stat-label" data-i18n="free_after"></div>
        <div class="stat-value"><span id="statFree">–</span><span class="stat-delta" id="statDelta"></span></div>
      </div>
      <div class="stat">
        <div class="stat-label"><i class="dot dot-safe"></i><span data-i18n="safe_to_remove"></span></div>
        <div class="stat-value"><span id="statSafe">–</span><span class="stat-unit" id="statSafeN"></span></div>
      </div>
      <div class="stat">
        <div class="stat-label"><i class="dot dot-review"></i><span data-i18n="needs_review"></span></div>
        <div class="stat-value"><span id="statReview">–</span><span class="stat-unit" id="statReviewN"></span></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="not_scanned"></div>
        <div class="stat-value"><span id="statOther">–</span><span class="stat-unit" data-i18n="system_apps"></span></div>
      </div>
      <div class="diskbar" id="diskbar" aria-hidden="true"></div>
      <div class="diskbar-legend" id="diskbarLegend"></div>
    </section>

    <section class="grid">
      <div class="card explorer">
        <div class="card-head">
          <div>
            <h2 data-i18n="explorer"></h2>
            <p class="muted" data-i18n="explorer_sub"></p>
          </div>
          <div class="seg" id="viewSeg" role="group">
            <button data-view="category" data-i18n="view_category"></button>
            <button data-view="cleanup" data-i18n="view_cleanup"></button>
          </div>
        </div>
        <div class="crumbs-row">
          <button class="icon-btn up-btn" id="upBtn" aria-label="up" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 15 7.5 10l5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <nav class="crumbs" id="crumbs"></nav>
          <span class="crumbs-size mono" id="crumbSize"></span>
        </div>
        <div class="treemap" id="treemap"></div>
        <div class="legend" id="legend"></div>
      </div>

      <aside class="card recs">
        <div class="card-head recs-head">
          <div>
            <h2 data-i18n="recommendations"></h2>
            <p class="muted" data-i18n="recs_sub"></p>
          </div>
        </div>
        <div class="recs-list" id="recsList"></div>
        <div class="recs-foot">
          <div class="sel-summary"><b class="mono" id="selSize">0 GB</b> <span id="selCount"></span></div>
          <div class="foot-actions">
            <button class="btn" id="selectSafeBtn" data-i18n="select_safe"></button>
            <button class="btn" id="scriptBtn" data-i18n="copy_script"></button>
            <button class="btn btn-primary" id="cleanBtn" data-i18n="clean_up"></button>
          </div>
        </div>

        <div class="drawer" id="drawer" aria-hidden="true">
          <div class="drawer-head">
            <button class="icon-btn" id="drawerBack" aria-label="back">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 15 7.5 10l5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="drawer-title">
              <span class="pill" id="drawerPill"></span>
              <h3 id="drawerTitle"></h3>
            </div>
          </div>
          <p class="drawer-desc" id="drawerDesc"></p>
          <p class="drawer-note" id="drawerNote" hidden></p>
          <div class="drawer-cmd" id="drawerCmd" hidden>
            <span data-i18n="alt_command"></span>
            <code id="drawerCmdText"></code>
          </div>
          <div class="drawer-bar">
            <label class="check"><input type="checkbox" id="drawerAll"><span></span></label>
            <span id="drawerCount"></span>
            <span class="mono drawer-total" id="drawerTotal"></span>
          </div>
          <div class="drawer-items" id="drawerItems"></div>
        </div>
      </aside>
    </section>
  </main>

  <!-- RAM: what is using memory, and quitting apps that are not needed -->
  <main class="app mem-view" id="memView" hidden>
    <section class="stats mem-stats">
      <div class="stat">
        <div class="stat-label" data-i18n="mem_used"></div>
        <div class="stat-value"><span id="memUsed">–</span><span class="stat-unit" id="memTotal"></span></div>
        <div class="mem-meter"><i id="memBar"></i></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="mem_pressure"></div>
        <div class="stat-value"><span class="pressure" id="memPressure">–</span></div>
        <div class="stat-note" id="memPressureNote"></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="mem_swap"></div>
        <div class="stat-value"><span id="memSwap">–</span><span class="stat-unit" id="memSwapTotal"></span></div>
        <div class="stat-note" data-i18n="mem_swap_note"></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="mem_quittable"></div>
        <div class="stat-value"><span id="memQuittable">–</span><span class="stat-unit" id="memQuittableN"></span></div>
        <div class="stat-note" data-i18n="mem_quittable_note"></div>
      </div>
    </section>
    <section class="card mem-card">
      <div class="card-head">
        <div>
          <h2 data-i18n="mem_apps"></h2>
          <p class="muted" data-i18n="mem_apps_sub"></p>
        </div>
        <span class="mem-live" id="memLive"><i></i><span data-i18n="mem_live"></span></span>
      </div>
      <div class="mem-list" id="memApps"></div>
      <details class="mem-more" id="memMore">
        <summary><span data-i18n="mem_background"></span> <span class="mono" id="memBgTotal"></span></summary>
        <p class="muted mem-more-note" data-i18n="mem_background_note"></p>
        <div class="mem-list" id="memBg"></div>
      </details>
    </section>
  </main>

  <!-- Apps: what is installed, and removing an app with everything it left behind -->
  <main class="app apps-view" id="appsView" hidden>
    <section class="stats apps-stats">
      <div class="stat">
        <div class="stat-label" data-i18n="apps_count"></div>
        <div class="stat-value"><span id="appsCount">–</span><span class="stat-unit" data-i18n="apps_unit"></span></div>
        <div class="stat-note" id="appsRunning"></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="apps_size"></div>
        <div class="stat-value"><span id="appsSize">–</span></div>
        <div class="stat-note" data-i18n="apps_size_note"></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="apps_data"></div>
        <div class="stat-value"><span id="appsData">–</span></div>
        <div class="stat-note" data-i18n="apps_data_note"></div>
      </div>
      <div class="stat" id="appsUnusedStat">
        <div class="stat-label" data-i18n="apps_unused"></div>
        <div class="stat-value"><span id="appsUnused">–</span><span class="stat-unit" id="appsUnusedN"></span></div>
        <div class="stat-note" data-i18n="apps_unused_note"></div>
      </div>
    </section>

    <section class="card apps-card">
      <div class="card-head">
        <div>
          <h2 data-i18n="apps_title"></h2>
          <p class="muted" data-i18n="apps_sub"></p>
        </div>
        <div class="apps-tools">
          <input type="search" class="search" id="appsSearch" autocomplete="off" spellcheck="false">
          <div class="seg seg-sm" id="appsSort" role="group">
            <button data-sort="size" data-i18n="sort_size"></button>
            <button data-sort="used" data-i18n="sort_used"></button>
            <button data-sort="name" data-i18n="sort_name"></button>
          </div>
          <button class="icon-btn" id="appsRefresh">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.4h-3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="apps-loading" id="appsLoading" hidden>
        <div class="progress"><i id="appsBar"></i></div>
        <span class="muted" id="appsLoadingText"></span>
      </div>
      <div class="mem-list" id="appsList"></div>
    </section>

    <section class="card apps-card" id="orphansCard" hidden>
      <div class="card-head">
        <div>
          <h2 data-i18n="orphans_title"></h2>
          <p class="muted" data-i18n="orphans_sub"></p>
        </div>
        <button class="btn" id="orphansBtn" disabled></button>
      </div>
      <div class="mem-list" id="orphansList"></div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="menu" id="menu" hidden></div>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="app.js?v=17"></script>
</body>
</html>
