# Build every download and attach it to the GitHub Release for the tag.
# Asset names must stay stable: README links to releases/latest/download/<name>.
# Run by hand (workflow_dispatch), or open a PR that changes this file, to build
# without publishing; the files are then only kept as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Signing and notarization are optional: without the secrets (fork PRs, or
      # before they are added) nothing is exported and the app builds unsigned.
      # Only non-empty values reach Tauri, which would otherwise try to use them.
      - name: Set up signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No signing secrets; building an unsigned app."
            exit 0
          fi
          # Own keychain (Tauri's temporary one is gone after the build, and the
          # DMG is signed after that).
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -A -T /usr/bin/codesign \
            -P "$APPLE_CERTIFICATE_PASSWORD"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No notarization secrets; the app is signed but not notarized."
          fi
      - name: Build universal app
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/PuriCleaner-mac.dmg
      # Tauri notarizes and staples the .app; the DMG around it gets its own
      # signature and ticket so Gatekeeper accepts the download itself.
      - name: Sign, notarize and check DMG
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          dmg=out/PuriCleaner-mac.dmg
          app="target/universal-apple-darwin/release/bundle/macos/Puri Cleaner.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          xcrun stapler validate "$app"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t install "$dmg"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # MSVC links WebView2Loader statically, so the portable exe needs no DLL beside it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build app and installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build browser version
        run: cargo build --release -p puri-cleaner-web
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if ($setup.Count -ne 1) { throw "expected one installer, found $($setup.Count)" }
          Copy-Item $setup.FullName out/PuriCleaner-windows-setup.exe
          $p = "Puri Cleaner portable"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target/release/puri-cleaner.exe "$p/Puri Cleaner.exe"
          Compress-Archive -Path $p -DestinationPath out/PuriCleaner-windows-portable.zip
          Copy-Item target/release/puri-cleaner-web.exe out/PuriCleaner-web-windows.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum PuriCleaner-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PuriCleaner-* SHA256SUMS.txt --clobber
          else
            # A tag with a suffix (v0.3.0-rc1) becomes a pre-release, so it
            # never takes over the releases/latest download links.
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" PuriCleaner-* SHA256SUMS.txt --title "Puri Cleaner ${TAG#v}" --generate-notes $pre
          fi
