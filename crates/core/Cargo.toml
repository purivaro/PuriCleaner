[package]
name = "puri_core"
version.workspace = true
edition.workspace = true

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
